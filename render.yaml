services:
  - type: web
    name: draw2seed-volunteers
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_DB_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_GALLERY_UPDATES
        value: '1'
      - key: COUNTERFACTUAL_ENFORCE
        value: '0'
      - key: ATTEMPTS_PER_HOUR
        value: '120'
